openapi: 3.1.0
info:
  title: AACV System API
  version: 0.1.0
  description: AACV 系统后端 REST API

servers:
  - url: /api/v1
    description: API base path

paths:
  /auth/csrf:
    get:
      summary: 获取 CSRF Token
      description: 建立 Session 并返回 CSRF Token，通过 Cookie 和响应 Header 传递
      responses:
        '200':
          description: CSRF Token 已下发
          headers:
            Set-Cookie:
              schema:
                type: string
              description: SESSION Cookie（HttpOnly）
            X-CSRF-TOKEN:
              schema:
                type: string
              description: CSRF Token

  /auth/login:
    post:
      summary: 用户登录
      description: 使用用户名和密码登录，成功后旋转 Session ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  example: admin123
      responses:
        '200':
          description: 登录成功，返回用户信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: 登录失败
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'

  /auth/logout:
    post:
      summary: 退出登录
      description: 使当前 Session 失效并清理 CSRF Token
      responses:
        '204':
          description: 退出成功

  /auth/me:
    get:
      summary: 获取当前用户信息
      description: 返回当前登录用户的详细信息、角色和权限
      responses:
        '200':
          description: 当前用户信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: 未登录或会话已过期
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'

components:
  schemas:
    UserResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: admin
        displayName:
          type: string
          example: 系统管理员
        roles:
          type: array
          items:
            type: string
            enum: [ADMIN, OPERATOR, VIEWER]
          example: [ADMIN]
        permissions:
          type: array
          items:
            type: string
          example: ["ROLE_ADMIN"]

    PageResponse:
      type: object
      properties:
        items:
          type: array
          items: {}
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        totalElements:
          type: integer
          example: 100
        totalPages:
          type: integer
          example: 5

    ProblemResponse:
      type: object
      properties:
        status:
          type: integer
          example: 400
        title:
          type: string
          example: Bad Request
        detail:
          type: string
          example: 请求参数不合法
        instance:
          type: string
          example: /api/v1/example
        errorCode:
          type: string
          example: VALIDATION_FAILED
        traceId:
          type: string
          example: 0123456789abcdef0123456789abcdef
        fieldErrors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: name
              message:
                type: string
                example: 不能为空