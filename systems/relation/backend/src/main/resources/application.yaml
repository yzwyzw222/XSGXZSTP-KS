spring:
  application:
    name: academic-graph

  # ===== MySQL：业务权威数据源（用户/角色/学术实体主数据，JPA 管理） =====
  datasource:
    # 连接参数：utf8mb4 编码 + UTC 时区 + 允许公钥检索（本机开发用，生产应启用 SSL）
    url: jdbc:mysql://localhost:3306/academic_graph?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    # 实际密码不写死在仓库：开发机密码见 gitignored 的 application-local.yaml（profile: local）
    password: ${MYSQL_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update   # 开发期由 Hibernate 自动建表/加列；生产环境应改为 validate + 迁移脚本
    open-in-view: false  # 关闭 OSIV，避免数据库连接被事务外视图渲染长期占用

  # ===== 文件上传（管理员数据导入用 multipart 表单） =====
  servlet:
    multipart:
      max-file-size: 5MB     # 单个导入文件上限
      max-request-size: 10MB # 整个 multipart 请求上限

  # ===== Neo4j：图投影存储（合作/引用/从属/主题关联），可整体重建，权威数据以 MySQL 为准 =====
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: ${NEO4J_PASSWORD:neo4j}

# ===== OpenAlex 在线爬取（管理员功能，feature/Luo 精简移植） =====
app:
  openalex:
    base-url: https://api.openalex.org
    per-page: 25            # 单页条数上限：每次只爬一页，25 条足够演示且不撞速率限制
    connect-timeout: 10s    # 建立 TCP 连接的超时
    response-timeout: 30s   # 等待响应的超时（OpenAlex 偶尔较慢）
    max-retries: 3          # 429/502/503/504 等可重试状态的最大重试次数
    mailto: ""              # 建议填自己的邮箱进入"礼貌池"；不填也能用公共池

  # ===== LLM 实体抽取（feature/Du 移植，OpenAI 兼容接口） =====
  llm:
    base-url: ${LLM_BASE_URL:https://api.openai.com/v1}  # 换成 DeepSeek/本地 ollama 等兼容服务即可
    api-key: ${LLM_API_KEY:}                            # 不填 key 也能启动，抽取会走 FAILED 路径
    model: gpt-4o-mini
    temperature: 0.1
    max-tokens: 4096

server:
  port: 8080

# ===== OpenAPI 文档（springdoc）：Swagger UI 与 /api-docs 契约导出 =====
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
