openapi: 3.0.3
info:
  title: 学术关系知识图谱构建平台 API
  version: 1.0.0
  description: >
    契约与后端实现同步（2026-09-07）。

    **鉴权机制**：服务端 Session + CSRF 防护，不使用 Bearer Token。
    登录/注册成功后浏览器凭 `JSESSIONID` Cookie（HttpOnly）保持会话；
    所有写操作（POST/PUT/DELETE）必须携带 `X-CSRF-TOKEN` 请求头，
    Token 通过 `GET /auth/csrf` 的 JSON 响应体获取（同时下发 XSRF-TOKEN Cookie）。

    **错误模型**：所有错误统一返回 `application/problem+json`（见 ApiError 结构），
    前端按 `errorCode` 分支处理：
    VALIDATION_FAILED(400) / AUTH_FAILED(401) / AUTH_REQUIRED(401) /
    NOT_FOUND(404) / CONFLICT(409) / FORBIDDEN(403) / INTERNAL_ERROR(500)。
servers:
  - url: /api/v1
    description: 本机开发环境
tags:
  - name: auth
    description: 注册、登录、登出与会话恢复
  - name: papers
    description: 论文主数据 + 署名/关键词/引用关系
  - name: authors
    description: 作者
  - name: institutions
    description: 机构
  - name: keywords
    description: 关键词
  - name: venues
    description: 发表渠道（期刊/会议等）
  - name: analytics
    description: 图谱分析四大维度（只读）
  - name: relations
    description: 关系分析板块：合作者/领域分区/机构/主题画像/机构间合作（只读钻取）
  - name: admin
    description: 用户管理、数据导入、在线爬取、实体抽取触发与图同步（仅 ADMIN）
  - name: extraction
    description: LLM 实体抽取图谱数据（只读，登录即可）

# ---------------------------------------------------------------
# 公共组件：参数 / 分页 / 错误
# ---------------------------------------------------------------
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: 登录/注册后由服务端下发，浏览器自动携带
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
      description: 写操作必填；值取自 GET /auth/csrf 响应体的 token 字段

  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      description: 页码，从 0 开始
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: 每页条数，默认 20 最大 100
    Keyword:
      name: keyword
      in: query
      required: false
      schema:
        type: string
      description: 名称模糊搜索

  responses:
    Unauthorized:
      description: 未登录或会话已过期
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            status: 401
            title: 未登录或会话已过期
            detail: 请先登录后再访问该接口
            instance: /api/v1/papers
            errorCode: AUTH_REQUIRED
    Forbidden:
      description: 权限不足（未带 CSRF Token 或角色不满足）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: 资源不存在
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: 乐观锁版本冲突或外键占用（被引用资源不可删除）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    BadRequest:
      description: 参数校验失败（Bean Validation 字段提示或业务规则不满足）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    ApiError:
      type: object
      properties:
        status:
          type: integer
          description: HTTP 状态码
        title:
          type: string
          description: 错误摘要（中文）
        detail:
          type: string
          description: 错误明细（中文，不泄露堆栈/SQL）
        instance:
          type: string
          description: 出错的请求路径
        errorCode:
          type: string
          description: 机器可读错误码，前端分支处理的依据
        traceId:
          type: string
          description: 32 位十六进制链路 ID，排障时后台日志按此检索
        fieldErrors:
          type: array
          nullable: true
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
        timestamp:
          type: string
          format: date-time

    PageInfo:
      type: object
      description: 分页公共结构（items 按各接口定义）
      properties:
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    # ---------- auth ----------
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          pattern: '^[a-zA-Z0-9_]+$'
          description: 用户名，仅字母数字下划线
        password:
          type: string
          minLength: 6
          maxLength: 64
        displayName:
          type: string
          maxLength: 64
          description: 显示名称，缺省时用用户名
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    SessionUserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
        roles:
          type: array
          items:
            type: string
          description: 角色编码列表（ADMIN/ANALYST）
        permissions:
          type: array
          items:
            type: string
          description: 展开后的权限码列表

    # ---------- papers ----------
    AuthorItem:
      type: object
      description: 署名条目（作者 + 位次 + 署名机构）
      required: [authorId, position]
      properties:
        authorId:
          type: integer
          format: int64
        position:
          type: integer
          minimum: 1
          description: 作者位次，从 1 开始
        institutionId:
          type: integer
          format: int64
          nullable: true
    ReferenceItem:
      type: object
      description: 引用条目：citedPaperId（库内引用）与 externalCitedDoi（外部引用线索）至少填一个
      properties:
        citedPaperId:
          type: integer
          format: int64
          nullable: true
        externalCitedDoi:
          type: string
          maxLength: 255
          nullable: true
    PaperUpsertRequest:
      type: object
      description: 创建/更新论文请求（更新时必填 version，与库中不一致返回 409）
      required: [title]
      properties:
        title:
          type: string
          maxLength: 500
        doi:
          type: string
          maxLength: 255
          description: 全库唯一，重复返回 400
        paperType:
          type: string
          enum: [JOURNAL_ARTICLE, CONFERENCE_PAPER, PATENT, OTHER]
          default: JOURNAL_ARTICLE
          description: 白名单校验，非法值返回 400
        language:
          type: string
          maxLength: 16
        publicationDate:
          type: string
          format: date
        abstractText:
          type: string
        citationCount:
          type: integer
          minimum: 0
          default: 0
        venueId:
          type: integer
          format: int64
          nullable: true
        volume:
          type: string
          maxLength: 32
          nullable: true
          description: 卷（知网导入扩展字段，可空字符串）
        period:
          type: string
          maxLength: 32
          nullable: true
          description: 期号（知网导入扩展字段，可含字母如 Z3）
        pageCount:
          type: string
          maxLength: 32
          nullable: true
          description: 页码区间（知网导入扩展字段，如 "12-18"）
        clcNumber:
          type: string
          maxLength: 64
          nullable: true
          description: 中图分类号（知网导入扩展字段，多值分号分隔）
        url:
          type: string
          maxLength: 500
          nullable: true
          description: 原文链接（知网导入扩展字段）
        authors:
          type: array
          items:
            $ref: '#/components/schemas/AuthorItem'
          description: 署名列表（全量替换语义）
        keywordIds:
          type: array
          items:
            type: integer
            format: int64
        references:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceItem'
        version:
          type: integer
          format: int64
          description: 乐观锁版本号（更新必填）
    VenueRef:
      type: object
      properties:
        id: { type: integer, format: int64 }
        displayName: { type: string }
    AuthorRef:
      type: object
      properties:
        authorId: { type: integer, format: int64 }
        displayName: { type: string }
        position: { type: integer }
        institutionId: { type: integer, format: int64, nullable: true }
        institutionName: { type: string, nullable: true }
    KeywordRef:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
    ReferenceRef:
      type: object
      properties:
        id: { type: integer, format: int64 }
        citedPaperId: { type: integer, format: int64, nullable: true }
        citedTitle: { type: string, nullable: true }
        externalCitedDoi: { type: string, nullable: true }
    PaperResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        doi: { type: string, nullable: true }
        paperType: { type: string }
        language: { type: string, nullable: true }
        publicationDate: { type: string, format: date, nullable: true }
        publicationYear: { type: integer, nullable: true, description: 自动按 publicationDate 折算 }
        abstractText: { type: string, nullable: true }
        citationCount: { type: integer }
        extractionStatus:
          type: string
          enum: [PENDING, IN_PROGRESS, COMPLETED, FAILED]
          description: LLM 抽取状态（实体抽取面板据此筛选与展示）
        venue:
          $ref: '#/components/schemas/VenueRef'
        volume: { type: string, nullable: true, description: 卷（知网导入扩展字段） }
        period: { type: string, nullable: true, description: 期号（知网导入扩展字段，可含字母如 Z3） }
        pageCount: { type: string, nullable: true, description: 页码区间（知网导入扩展字段） }
        clcNumber: { type: string, nullable: true, description: 中图分类号（知网导入扩展字段） }
        url: { type: string, nullable: true, description: 原文链接（知网导入扩展字段） }
        authors:
          type: array
          items: { $ref: '#/components/schemas/AuthorRef' }
        keywords:
          type: array
          items: { $ref: '#/components/schemas/KeywordRef' }
        references:
          type: array
          items: { $ref: '#/components/schemas/ReferenceRef' }
        version: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PaperPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/PaperResponse' }

    # ---------- authors / institutions / keywords / venues ----------
    AuthorUpsertRequest:
      type: object
      required: [displayName]
      properties:
        displayName: { type: string, maxLength: 255 }
        orcid: { type: string, maxLength: 64 }
        version: { type: integer, format: int64, description: 更新必填（乐观锁） }
    AuthorResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        displayName: { type: string }
        orcid: { type: string, nullable: true }
        version: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AuthorPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AuthorResponse' }

    InstitutionUpsertRequest:
      type: object
      required: [displayName]
      properties:
        displayName: { type: string, maxLength: 255 }
        countryCode: { type: string, maxLength: 2, description: 2 位 ISO 国家码（如 CN/US） }
        institutionType: { type: string, maxLength: 64 }
        version: { type: integer, format: int64, description: 更新必填（乐观锁） }
    InstitutionResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        displayName: { type: string }
        countryCode: { type: string, nullable: true }
        institutionType: { type: string, nullable: true }
        version: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    InstitutionPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/InstitutionResponse' }

    KeywordUpsertRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 255, description: 全库唯一，重复返回 400 }
        fieldName: { type: string, maxLength: 255 }
    KeywordResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        fieldName: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    KeywordPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/KeywordResponse' }

    VenueUpsertRequest:
      type: object
      required: [displayName]
      properties:
        displayName: { type: string, maxLength: 500 }
        issn: { type: string, maxLength: 16 }
        venueType: { type: string, maxLength: 64, description: 如 journal/conference }
    VenueResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        displayName: { type: string }
        issn: { type: string, nullable: true }
        venueType: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    VenuePage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/VenueResponse' }

    # ---------- analytics ----------
    CollaborationItem:
      type: object
      description: 合作条目：两位作者共同署名的论文数（collaborations 实时聚合与 coauthor-edges 物化边共用此结构）
      properties:
        author1Id: { type: integer, format: int64 }
        author1: { type: string }
        author2Id: { type: integer, format: int64 }
        author2: { type: string }
        paperCount: { type: integer, format: int64 }
    CitationItem:
      type: object
      description: 引用统计条目：图内被引（citesIn）与施引（citesOut）次数
      properties:
        paperId: { type: integer, format: int64 }
        title: { type: string }
        citesOut: { type: integer, format: int64 }
        citesIn: { type: integer, format: int64 }
    TopicEvolutionItem:
      type: object
      description: 主题演化明细行：年份 × 关键词出现频次（前端按年分组渲染曲线）
      properties:
        year: { type: integer }
        keyword: { type: string }
        paperCount: { type: integer, format: int64 }
    InstitutionImpactItem:
      type: object
      description: 机构影响力条目：署名论文数与引用热度合计（论文去重后求和）
      properties:
        institution: { type: string }
        paperCount: { type: integer, format: int64 }
        totalCitations: { type: integer, format: int64 }

    # ---------- relations（关系分析板块） ----------
    CoauthorItem:
      type: object
      description: 某作者的合作者条目：合著篇数、共同论文标题（最多 5 篇）、对方机构与同机构标记
      properties:
        authorId: { type: integer, format: int64 }
        authorName: { type: string }
        paperCount: { type: integer, format: int64 }
        paperTitles:
          type: array
          items: { type: string }
          description: 共同署名论文标题（截断到前 5 篇）
        institutions:
          type: array
          items: { type: string }
          description: 合作者的署名机构名列表
        sameInstitution: { type: boolean }
    FieldPartitionItem:
      type: object
      description: 领域分区明细行：某领域下某位作者的论文数（前端按 field 分组聚合）
      properties:
        field: { type: string }
        authorId: { type: integer, format: int64 }
        authorName: { type: string }
        paperCount: { type: integer, format: int64 }
    AuthorTopicItem:
      type: object
      description: 某作者的研究主题条目：关键词频次与出现年份列表（画主题迁移区间用）
      properties:
        keywordId: { type: integer, format: int64 }
        keyword: { type: string }
        fieldName: { type: string, nullable: true }
        paperCount: { type: integer, format: int64 }
        years:
          type: array
          items: { type: integer }
          description: 该关键词出现的发表年份（去重）
    InstitutionAuthorItem:
      type: object
      description: 机构下作者条目：论文数与引用热度合计
      properties:
        authorId: { type: integer, format: int64 }
        authorName: { type: string }
        paperCount: { type: integer, format: int64 }
        totalCitations: { type: integer, format: int64 }
    InstitutionCollabItem:
      type: object
      description: 机构间合作条目：跨机构合著论文数（每对机构只出现一次，不含同机构内部合作）
      properties:
        inst1Id: { type: integer, format: int64 }
        inst1: { type: string }
        inst2Id: { type: integer, format: int64 }
        inst2: { type: string }
        paperCount: { type: integer, format: int64 }

    # ---------- admin ----------
    CreateUserRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 64, pattern: '^[a-zA-Z0-9_]+$' }
        password: { type: string, minLength: 6, maxLength: 64 }
        displayName: { type: string, maxLength: 64 }
        roles:
          type: array
          items: { type: string, enum: [ADMIN, ANALYST] }
          description: 缺省默认 ANALYST
    UpdateRolesRequest:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          items: { type: string, enum: [ADMIN, ANALYST] }
          description: 整体替换（不是追加）
    UpdateStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ACTIVE, DISABLED], description: 禁用后无法登录 }
    UserAdminResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        displayName: { type: string }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        roles:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
    UserAdminPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/UserAdminResponse' }
    ImportInstitutionItem:
      type: object
      properties:
        name: { type: string, description: 机构名称（按名称去重复用） }
        countryCode: { type: string, description: 国家代码，如 CN }
    ImportAuthorItem:
      type: object
      properties:
        name: { type: string, description: 作者姓名（按名称去重复用） }
        orcid: { type: string }
        institution: { $ref: '#/components/schemas/ImportInstitutionItem' }
    ImportKeywordItem:
      type: object
      properties:
        name: { type: string, description: 关键词（按名称去重复用） }
        fieldName: { type: string, description: 研究领域 }
    ImportReferenceItem:
      type: object
      required: [externalDoi]
      properties:
        externalDoi:
          type: string
          maxLength: 255
          description: 被引文献外部线索（在线爬取存 OpenAlex 文献 URL，手工导入可省略）
    ImportVenueItem:
      type: object
      properties:
        name: { type: string, description: 渠道名称（按名称去重复用） }
        venueType: { type: string }
        issn: { type: string }
    ImportPaperItem:
      type: object
      required: [title, authors]
      properties:
        title: { type: string, description: 论文标题（判重依据之一） }
        doi: { type: string, description: 判重依据：DOI 已存在则跳过该条 }
        paperType: { type: string, enum: [JOURNAL_ARTICLE, CONFERENCE_PAPER, PATENT, OTHER], default: JOURNAL_ARTICLE }
        language: { type: string }
        publicationDate: { type: string, format: date }
        abstractText: { type: string }
        citationCount: { type: integer }
        venue: { $ref: '#/components/schemas/ImportVenueItem' }
        authors:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ImportAuthorItem' }
        keywords:
          type: array
          items: { $ref: '#/components/schemas/ImportKeywordItem' }
        references:
          type: array
          items: { $ref: '#/components/schemas/ImportReferenceItem' }
          description: 被引文献线索（写入 paper_reference 的 external_cited_doi）
        volume: { type: string }
        period: { type: string }
        pageCount: { type: string }
        clcNumber: { type: string }
        url: { type: string }
    ImportRequest:
      type: object
      required: [papers]
      properties:
        papers:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ImportPaperItem' }
    ImportResultRow:
      type: object
      properties:
        index: { type: integer, description: 文件中的序号（1 起） }
        status: { type: string, enum: [IMPORTED, SKIPPED, FAILED] }
        message: { type: string, description: 跳过/失败原因（成功为 null） }
        paperId: { type: integer, format: int64 }
        title: { type: string }
    ImportSummary:
      type: object
      properties:
        total: { type: integer, description: 文件内论文总条数 }
        imported: { type: integer, description: 成功入库条数 }
        skipped: { type: integer, description: 判重跳过条数 }
        failed: { type: integer, description: 失败条数（逐条隔离，不影响其他篇） }
        createdAuthors: { type: integer, description: 本次新建的作者数 }
        createdInstitutions: { type: integer, description: 本次新建的机构数 }
        createdKeywords: { type: integer, description: 本次新建的关键词数 }
        createdVenues: { type: integer, description: 本次新建的渠道数 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/ImportResultRow' }

    # ---------- 在线爬取（OpenAlex） ----------
    CrawlRequest:
      type: object
      required: [keyword]
      properties:
        keyword: { type: string, minLength: 1, maxLength: 200, description: OpenAlex 搜索关键词 }
        maxRecords:
          type: integer
          minimum: 1
          maximum: 25
          description: 期望条数（OpenAlex 单页上限 25，缺省走服务端配置）

    # ---------- 实体抽取（LLM） ----------
    ExtractionTriggerRequest:
      type: object
      properties:
        paperIds:
          type: array
          items: { type: integer, format: int64, minimum: 1 }
          description: 待抽取论文 id 列表；缺省时后端取最早的 10 篇 PENDING
    ExtractionTriggerResponse:
      type: object
      properties:
        message: { type: string, description: 提示轮询 /status/{paperId} 观察进度 }
        queuedCount: { type: integer, description: 进入异步队列的篇数 }
        paperIds:
          type: array
          items: { type: integer, format: int64 }
    ExtractionStatus:
      type: object
      properties:
        paperId: { type: integer, format: int64 }
        paperTitle: { type: string }
        status: { type: string, enum: [PENDING, IN_PROGRESS, COMPLETED, FAILED] }
        extractedEntityCount: { type: integer, format: int64, description: 台账实体行数 }
        extractedRelationshipCount: { type: integer, format: int64, description: 台账关系行数 }
    ExtractionEntity:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        type:
          type: string
          enum: [METHOD, DATASET, TOOL, TOPIC, ORGANIZATION, PERSON]
          description: LLM 输出的六类实体（非法值会被兜底为 TOPIC）
        resolvedEntityType:
          type: string
          nullable: true
          enum: [AUTHOR, INSTITUTION, KEYWORD, RESEARCH_ENTITY]
          description: 归并到的业务实体类型（未归并为 null）
        resolvedEntityId: { type: integer, format: int64, nullable: true }
    ExtractionRelationship:
      type: object
      properties:
        id: { type: integer, format: int64 }
        sourceName: { type: string, description: 源实体名称（后端已回填） }
        targetName: { type: string, description: 目标实体名称（后端已回填） }
        type:
          type: string
          enum: [USES, EXTENDS, EVALUATES_ON, APPLIED_TO, PROPOSED_BY, COMPARED_WITH]
        evidence: { type: string, description: LLM 给出的原文依据 }
        confidence: { type: number }
    ExtractionResult:
      type: object
      properties:
        paperId: { type: integer, format: int64 }
        paperTitle: { type: string }
        status: { type: string, enum: [PENDING, IN_PROGRESS, COMPLETED, FAILED] }
        entities:
          type: array
          items: { $ref: '#/components/schemas/ExtractionEntity' }
        relationships:
          type: array
          items: { $ref: '#/components/schemas/ExtractionRelationship' }
    ExtractionGraphNode:
      type: object
      properties:
        id:
          type: string
          description: 与 GraphView 既有命名规则一致：research_9 / author_3 / institution_5 / keyword_7
        label: { type: string }
        type: { type: string, enum: [research, author, institution, keyword], description: 前端样式映射键 }
        entityType:
          type: string
          nullable: true
          enum: [METHOD, DATASET, TOOL]
          description: 仅研究实体节点有值（区分方法/数据集/工具）
    ExtractionGraphEdge:
      type: object
      properties:
        id: { type: string }
        source: { type: string }
        target: { type: string }
        kind:
          type: string
          enum: [extracted, llm]
          description: extracted=EXTRACTED_FROM 证据边；llm=LLM 抽取的关系边
        label: { type: string, description: extracted 边固定 EXTRACTED_FROM；llm 边是关系类型名 }
        evidence: { type: string }
        confidence: { type: number }
    ExtractionGraphData:
      type: object
      properties:
        nodes:
          type: array
          items: { $ref: '#/components/schemas/ExtractionGraphNode' }
        edges:
          type: array
          items: { $ref: '#/components/schemas/ExtractionGraphEdge' }

# ---------------------------------------------------------------
# 接口定义
# ---------------------------------------------------------------
paths:
  # ============ auth ============
  /auth/csrf:
    get:
      tags: [auth]
      summary: 获取 CSRF Token
      description: 免登录。Token 在 JSON 响应体 `token` 字段下发，同时 Set-Cookie XSRF-TOKEN。前端写操作把它放进 X-CSRF-TOKEN 请求头。
      security: []
      responses:
        "200":
          description: Token 获取成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                example:
                  token: 5d3c63a9-3b74-4eae-a46e-207602b4f9b8
  /auth/register:
    post:
      tags: [auth]
      summary: 用户注册（默认授予 ANALYST 角色）
      description: 免登录、免 CSRF。成功后直接建立会话（Set-Cookie JSESSIONID）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        "201":
          description: 注册成功并已登录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionUserResponse' }
        "400":
          $ref: '#/components/responses/BadRequest'
  /auth/login:
    post:
      tags: [auth]
      summary: 登录（成功后旋转 Session ID）
      description: 免登录、免 CSRF。校验失败统一返回 401「用户名或密码错误」（防用户名枚举）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionUserResponse' }
        "401":
          description: 用户名或密码错误 / 账号被禁用（AUTH_FAILED）
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /auth/me:
    get:
      tags: [auth]
      summary: 当前登录用户信息（前端刷新页面后恢复会话状态用）
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: 会话有效
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionUserResponse' }
        "401":
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags: [auth]
      summary: 退出登录（销毁服务端会话）
      security: [{ sessionCookie: [] }, { csrfHeader: [] }]
      responses:
        "204":
          description: 已退出，原会话失效

  # ============ papers ============
  /papers:
    get:
      tags: [papers]
      summary: 论文分页列表
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Keyword'
        - name: paperType
          in: query
          required: false
          schema: { type: string }
          description: 类型精确过滤（JOURNAL_ARTICLE 等）
        - name: year
          in: query
          required: false
          schema: { type: integer }
          description: 发表年份精确过滤
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        "200":
          description: 分页结果（按 id 倒序）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaperPage' }
        "401":
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [papers]
      summary: 创建论文（含署名/关键词/引用关系，同一事务全有或全无）
      security: [{ sessionCookie: [] }, { csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaperUpsertRequest' }
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaperResponse' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
  /papers/{id}:
    get:
      tags: [papers]
      summary: 论文详情（含署名/关键词/引用展开）
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 论文详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaperResponse' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
    put:
      tags: [papers]
      summary: 更新论文（全量替换语义，version 乐观锁）
      description: 请求体必须带 version；与库中不一致返回 409。关系字段缺省视为清空。
      security: [{ sessionCookie: [] }, { csrfHeader: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaperUpsertRequest' }
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaperResponse' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [papers]
      summary: 删除论文（关系行随外键级联删除，图节点异步摘除）
      security: [{ sessionCookie: [] }, { csrfHeader: [] }]
