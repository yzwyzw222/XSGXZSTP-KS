              schema:
                type: array
                items: { $ref: '#/components/schemas/TopicEvolutionItem' }
  /analytics/institution-impact:
    get:
      tags: [analytics]
      summary: 机构影响力 TOP-N（署名论文引用热度合计，论文去重）
      security: [{ sessionCookie: [] }]
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: 机构影响力列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InstitutionImpactItem' }
  /analytics/coauthor-edges:
    get:
      tags: [analytics]
      summary: 合作关系边（读取物化的 COAUTHOR_WITH，供图谱直接连线）
      description: |
        与 /analytics/collaborations 同样返回作者对与合著篇数，但数据源是 Neo4j 中
        预先物化的 `COAUTHOR_WITH {weight, computedAt}` 派生边（由同步流程全量重算），
        因此单次查询只做关系遍历、不做共现聚合，适合前端一次性拉取用于画边。
        边在论文写入或管理员触发 `POST /admin/sync-graph` 后重算，最终一致。
      security: [{ sessionCookie: [] }]
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
      responses:
        "200":
          description: 合作关系边列表（按 paperCount 降序）
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CollaborationItem' }

  # ============ relations（关系分析板块） ============
  /relations/coauthors:
    get:
      tags: [relations]
      summary: 某作者的合作者（按合著篇数降序）
      description: |
        在 Neo4j 图投影上实时计算：某作者的论文 → 共同署名的其他作者。
        sameInstitution 表示合作者与该作者是否至少共享一家署名机构（服务端集合求交）；
        paperTitles 截断到共同论文标题的前 5 篇，防止高产作者把响应撑大。
      security: [{ sessionCookie: [] }]
      parameters:
        - name: authorId
          in: query
          required: true
          schema: { type: integer, format: int64 }
          description: 要查看的作者 id（缺失返回 400）
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: 合作者列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CoauthorItem' }
        "400":
          $ref: '#/components/responses/BadRequest'
  /relations/field-partition:
    get:
      tags: [relations]
      summary: 全体作者按研究领域分区（扁平行，前端按 field 分组）
      description: 领域来自关键词的 field_name（知网分类），缺失时归入「未分类」。
      security: [{ sessionCookie: [] }]
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 2000, default: 500 }
      responses:
        "200":
          description: 领域分区明细行（按 field 升序、论文数降序）
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FieldPartitionItem' }
  /relations/author-topics:
    get:
      tags: [relations]
      summary: 某作者的研究主题画像（关键词频次与出现年份）
      security: [{ sessionCookie: [] }]
      parameters:
        - name: authorId
          in: query
          required: true
          schema: { type: integer, format: int64 }
          description: 要查看的作者 id（缺失返回 400）
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: 主题画像列表（按频次降序）
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuthorTopicItem' }
        "400":
          $ref: '#/components/responses/BadRequest'
  /relations/institution-authors:
    get:
      tags: [relations]
      summary: 某机构下的作者（论文数与引用热度合计，按论文数降序）
      security: [{ sessionCookie: [] }]
      parameters:
        - name: institutionId
          in: query
          required: true
          schema: { type: integer, format: int64 }
          description: 要查看的机构 id（缺失返回 400）
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: 机构作者列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InstitutionAuthorItem' }
        "400":
          $ref: '#/components/responses/BadRequest'
  /relations/institution-collaborations:
    get:
      tags: [relations]
      summary: 机构间合作 TOP-N（跨机构合著论文数，降序）
      description: |
        在 Neo4j 图投影上实时计算：同一篇论文的署名作者分属不同机构即记一次合作。
        businessId 大小比较保证每对机构只出现一次，且天然排除同机构内部合作。
      security: [{ sessionCookie: [] }]
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: 机构间合作列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InstitutionCollabItem' }

  # ============ admin ============
  /admin/users:
    get:
      tags: [admin]
      summary: 用户分页列表（keyword 按用户名模糊搜索）
      description: 仅 ADMIN。普通用户访问返回 403 FORBIDDEN。
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Keyword'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        "200":
          description: 用户分页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserAdminPage' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [admin]
      summary: 创建用户（可指定初始角色，缺省 ANALYST）
      security: [{ sessionCookie: [] }, { csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserAdminResponse' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "403":
          $ref: '#/components/responses/Forbidden'
  /admin/users/{id}/roles:
    put:
      tags: [admin]
      summary: 重置用户角色（整体替换）
      security: [{ sessionCookie: [] }, { csrfHeader: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRolesRequest' }
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserAdminResponse' }
        "404":
          $ref: '#/components/responses/NotFound'
        "403":
          $ref: '#/components/responses/Forbidden'
  /admin/users/{id}/status:
    put:
      tags: [admin]
      summary: 启用/禁用账号（禁用后登录返回 401）
      security: [{ sessionCookie: [] }, { csrfHeader: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateStatusRequest' }
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserAdminResponse' }
        "404":
          $ref: '#/components/responses/NotFound'
        "403":
          $ref: '#/components/responses/Forbidden'
  /admin/users/{id}:
    delete:
      tags: [admin]
      summary: 删除账号（禁止删除当前登录账号）
      security: [{ sessionCookie: [] }, { csrfHeader: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204":
          description: 删除成功
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "403":
          $ref: '#/components/responses/Forbidden'
  /admin/import/papers:
    post:
      tags: [admin]
      summary: 批量导入论文（multipart 上传 JSON 文件）
      description: |
        上传「论文为中心」的嵌套 JSON 文件（格式见 `ImportRequest`，也可下载页面上的导入模板）。
        服务端按名称去重复用作者/机构/关键词/渠道，论文按 DOI/标题判重（已存在则 SKIPPED），
        单条失败只记 FAILED 不影响其他篇；全部写入同一事务并发出图同步事件。
        单文件上限 5MB（超限返回 400）。
      security: [{ sessionCookie: [] }, { csrfHeader: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: 导入 JSON 文件（ImportRequest 结构） }
      responses:
        "200":
          description: 导入完成，返回逐条结果与新建对象计数
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportSummary' }
        "400":
          description: 文件缺失 / 不是合法 JSON / 超过 5MB 上限
          $ref: '#/components/responses/BadRequest'
        "403":
          $ref: '#/components/responses/Forbidden'
  /admin/sync-graph:
    post:
      tags: [admin]
      summary: 手动触发图同步
      description: 立即处理全部 PENDING 事件并返回处理条数。正常情况由后台每 5 秒自动执行，此接口供排查/演示。
      security: [{ sessionCookie: [] }, { csrfHeader: [] }]
      responses:
        "200":
          description: 本次处理的 PENDING 事件条数
          content:
            application/json:
              schema:
                type: object
                properties:
                  processed: { type: integer }
                example:
                  processed: 3
        "403":
          $ref: '#/components/responses/Forbidden'

  # ============ 在线爬取（OpenAlex，ADMIN） ============
  /admin/crawl/openalex:
    post:
      tags: [admin]
      summary: 在线爬取 OpenAlex（关键词搜索单页入库）
      description: |
        按关键词搜索 OpenAlex /works 单页（≤25 条），解析后映射到五实体落库：
        论文按 DOI 判重（已存在 SKIPPED），作者/机构/关键词/渠道按名称去重复用，
        引用线索（referenced_works 的 OpenAlex URL）写入 paper_reference.external_cited_doi。
        需联网；OpenAlex 上游错误（超时/限流/5xx）统一转 502 UPSTREAM_ERROR。
      security: [{ sessionCookie: [] }, { csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CrawlRequest' }
      responses:
        "200":
          description: 爬取完成，返回与文件导入同构的汇总（IMPORTED/SKIPPED/FAILED 逐条明细）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportSummary' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "403":
          $ref: '#/components/responses/Forbidden'
        "502":
          description: OpenAlex 上游错误（限流 / 超时 / 5xx，不可重试状态直接放弃）
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example:
                status: 502
                errorCode: UPSTREAM_ERROR
                detail: OpenAlex 请求超时，请稍后重试

  # ============ 实体抽取触发与查询（ADMIN） ============
  /admin/extraction/trigger:
    post:
      tags: [admin]
      summary: 触发 LLM 实体抽取（异步）
      description: |
        paperIds 缺省时取最早的 10 篇 PENDING 论文；重复触发同一论文会被去重拦截。
        接口立即返回 202，后台线程逐篇执行状态机 PENDING→IN_PROGRESS→COMPLETED/FAILED：
        无摘要直接 FAILED；LLM 调用失败重试 3 次仍失败则 FAILED。
        抽取结果写台账（extracted_entities/entity_relationship）并归并到五实体与
        research_entity（METHOD/DATASET/TOOL），重跑会先清台账与关系再全量覆盖
        （paper_author/paper_keyword 追加行保留，幂等无害）。
      security: [{ sessionCookie: [] }, { csrfHeader: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExtractionTriggerRequest' }
      responses:
        "202":
          description: 任务已进入异步队列，前端按 paperIds 轮询状态接口
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtractionTriggerResponse' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "403":
          $ref: '#/components/responses/Forbidden'
  /admin/extraction/status/{paperId}:
    get:
      tags: [admin]
      summary: 查询单篇抽取状态（前端 2 秒轮询）
      parameters:
        - { name: paperId, in: path, required: true, schema: { type: integer, format: int64 } }
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: 状态 + 台账实体/关系计数
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtractionStatus' }
        "404":
          $ref: '#/components/responses/NotFound'
  /admin/extraction/result/{paperId}:
    get:
      tags: [admin]
      summary: 查询单篇抽取明细（台账实体行 + 关系行）
      parameters:
        - { name: paperId, in: path, required: true, schema: { type: integer, format: int64 } }
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: 台账实体与关系明细（端点已回填名称）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtractionResult' }
        "404":
          $ref: '#/components/responses/NotFound'

  # ============ 抽取图谱数据（登录即可） ============
  /extraction/graph-data:
    get:
      tags: [extraction]
      summary: 抽取图谱数据（研究实体 + EXTRACTED_FROM + LLM 关系边）
      description: |
        登录即可访问（只读聚合）。paperIds 缺省返回全部已抽取论文的数据；
        需要按论文过滤时可重复传参（?paperIds=1&paperIds=2）。
        节点只包含已归并的业务实体，边分两类：extracted=EXTRACTED_FROM 证据边、
        llm=六类 LLM 关系边。GraphView 把本接口数据叠加到主图谱上展示。
      security: [{ sessionCookie: [] }]
      parameters:
        - name: paperIds
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { type: integer, format: int64 }
      responses:
        "200":
          description: 节点与边（与主图谱同构，可直接合并渲染）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtractionGraphData' }
