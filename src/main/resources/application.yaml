spring:
  application:
    name: academic_entity_extract_kg_construction

  datasource:
    url: jdbc:mysql://localhost:3306/academic_kg?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: password

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
      timeout: 30m

app:
  semantic-scholar:
    base-url: https://api.semanticscholar.org/graph/v1
    api-key: ${SEMANTIC_SCHOLAR_API_KEY:}
    rate-limit-per-second: 1

  llm:
    base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
    api-key: ${LLM_API_KEY:}
    model: gpt-4o-mini
    temperature: 0.1
    max-tokens: 4096

  admin:
    username: admin
    password: admin123

logging:
  level:
    com.example: DEBUG
    org.hibernate.SQL: DEBUG
