openapi: 3.1.0
info:
  title: AACV System 阶段 7 API
  version: 7.0.0
  description: 本契约描述认证、用户、审计、双源采集、MySQL 数据治理、规范目录、事务 Outbox、Neo4j 可重建投影、受限图查询、MySQL 聚合统计、异步导出和管理员运维接口；不包含服务器部署能力。
servers:
  - url: http://127.0.0.1:8080
    description: Windows 本地开发后端
tags:
  - name: Auth
  - name: Users
  - name: Audits
  - name: Sources
  - name: Crawl Tasks
  - name: Crawl Runs
  - name: Catalog
  - name: Governance
  - name: Quality
  - name: Graph
  - name: Graph Operations
  - name: Analytics
  - name: Exports
  - name: Operations
paths:
  /api/v1/auth/csrf:
    get:
      tags: [Auth]
      summary: 获取当前会话的 CSRF Token
      operationId: getCsrfToken
      responses:
        '200':
          description: Token 已创建或读取
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: 使用本地账号登录
      operationId: login
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功并创建服务端会话
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: 注销当前会话
      operationId: logout
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: 会话已注销
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: 查询当前账号及权限
      operationId: getCurrentUser
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 当前账号
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/users:
    get:
      tags: [Users]
      summary: 管理员分页查询用户
      operationId: listUsers
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 用户分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Users]
      summary: 管理员创建用户
      operationId: createUser
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: 用户已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/users/{userId}/enable:
    post:
      tags: [Users]
      summary: 启用用户
      operationId: enableUser
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        $ref: '#/components/requestBodies/VersionRequest'
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/users/{userId}/disable:
    post:
      tags: [Users]
      summary: 停用用户并使其会话失效
      operationId: disableUser
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        $ref: '#/components/requestBodies/VersionRequest'
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/users/{userId}/reset-password:
    post:
      tags: [Users]
      summary: 重置密码并使旧会话失效
      operationId: resetUserPassword
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/users/{userId}/roles:
    post:
      tags: [Users]
      summary: 替换用户角色并使旧会话失效
      operationId: replaceUserRoles
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceRolesRequest'
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/operations/audits:
    get:
      tags: [Audits]
      summary: 管理员分页查询审计记录
      operationId: listAudits
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 审计分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/sources:
    get:
      tags: [Sources]
      summary: 分页查询受控数据源
      operationId: listSources
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 数据源分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourcePage'
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Sources]
      summary: 创建唯一的受控 OpenAlex 或 Crossref 数据源配置
      operationId: createSource
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SourceConfigurationRequest'}
      responses:
        '201':
          description: 数据源已创建
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DataSource'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/sources/{sourceId}:
    get:
      tags: [Sources]
      summary: 查询数据源详情
      operationId: getSource
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/SourceId'
      responses:
        '200':
          description: 数据源详情
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DataSource'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Sources]
      summary: 更新数据源受控配置
      operationId: updateSource
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/SourceId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SourceConfigurationRequest'}
      responses:
        '200':
          description: 数据源已更新
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DataSource'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/sources/{sourceId}/enable:
    post:
      tags: [Sources]
      summary: 启用数据源
      operationId: enableSource
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/SourceId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody: {$ref: '#/components/requestBodies/VersionRequest'}
      responses:
        '200':
          description: 数据源已启用
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DataSource'}
  /api/v1/sources/{sourceId}/disable:
    post:
      tags: [Sources]
      summary: 停用数据源
      operationId: disableSource
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/SourceId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody: {$ref: '#/components/requestBodies/VersionRequest'}
      responses:
        '200':
          description: 数据源已停用
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DataSource'}
  /api/v1/sources/{sourceId}/probe:
    post:
      tags: [Sources]
      summary: 对来源对应的固定官方地址执行无数据写入探测
      operationId: probeSource
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/SourceId'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: 探测结果
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SourceProbe'}
  /api/v1/crawl/tasks:
    get:
      tags: [Crawl Tasks]
      summary: 分页查询采集任务
      operationId: listCrawlTasks
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 任务分页
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CrawlTaskPage'}
    post:
      tags: [Crawl Tasks]
      summary: 创建有界 OpenAlex 或 Crossref 采集任务
      operationId: createCrawlTask
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCrawlTaskRequest'}
      responses:
        '201':
          description: 任务已创建
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CrawlTask'}
  /api/v1/crawl/tasks/{taskId}:
    get:
      tags: [Crawl Tasks]
      summary: 查询采集任务详情
      operationId: getCrawlTask
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 任务详情
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CrawlTask'}
    put:
      tags: [Crawl Tasks]
      summary: 更新尚未运行的采集任务
      operationId: updateCrawlTask
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateCrawlTaskRequest'}
      responses:
        '200':
          description: 任务已更新
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CrawlTask'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/crawl/tasks/{taskId}/trigger:
    post:
      tags: [Crawl Tasks]
      summary: 手动触发一次采集运行
      operationId: triggerCrawlTask
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '202':
          description: 运行已创建
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CrawlRun'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/crawl/tasks/{taskId}/schedule:
    put:
      tags: [Crawl Tasks]
      summary: 按来源能力配置每日滚动或封闭索引日期窗口计划
      operationId: configureDailySchedule
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DailyScheduleRequest'}
      responses:
        '200':
          description: 每日计划已配置
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CrawlSchedule'}
  /api/v1/crawl/runs/{runId}:
    get:
      tags: [Crawl Runs]
      summary: 查询运行详情和检查点统计
      operationId: getCrawlRun
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: 运行详情
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CrawlRun'}
  /api/v1/crawl/runs/{runId}/failures:
    get:
      tags: [Crawl Runs]
      summary: 分页查询运行失败记录
      operationId: listCrawlFailures
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 失败记录分页
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CrawlFailurePage'}
  /api/v1/crawl/runs/{runId}/pause:
    post:
      tags: [Crawl Runs]
      summary: 请求在当前 Chunk 提交后暂停
      operationId: pauseCrawlRun
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '202': {description: 暂停意图已记录}
  /api/v1/crawl/runs/{runId}/resume:
    post:
      tags: [Crawl Runs]
      summary: 从最近成功检查点恢复运行
      operationId: resumeCrawlRun
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '202': {description: 恢复已请求}
  /api/v1/crawl/runs/{runId}/cancel:
    post:
      tags: [Crawl Runs]
      summary: 请求在当前 Chunk 提交后取消
      operationId: cancelCrawlRun
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '202': {description: 取消意图已记录}
  /api/v1/crawl/runs/{runId}/retry-failures:
    post:
      tags: [Crawl Runs]
      summary: 有限重试失败记录并保留原运行证据
      operationId: retryCrawlFailures
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '202': {description: 重试运行已创建}
  /api/v1/catalog/achievements:
    get:
      tags: [Catalog]
      summary: 组合筛选并分页查询成果目录
      operationId: listAchievements
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - {name: title, in: query, schema: {type: string, maxLength: 200}}
        - {name: author, in: query, schema: {type: string, maxLength: 200}}
        - {name: organization, in: query, schema: {type: string, maxLength: 200}}
        - {name: publicationYear, in: query, schema: {type: integer, minimum: 1000, maximum: 9999}}
        - {name: achievementType, in: query, schema: {type: string, maxLength: 64}}
        - {name: sourceCode, in: query, schema: {type: string, enum: [OPENALEX, CROSSREF]}}
        - {name: venue, in: query, schema: {type: string, maxLength: 200}}
        - {name: topic, in: query, schema: {type: string, maxLength: 200}}
      responses:
        '200':
          description: 成果分页
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AchievementPage'}
  /api/v1/catalog/achievements/{achievementId}:
    get:
      tags: [Catalog]
      summary: 查询成果详情与来源追溯
      operationId: getAchievement
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/AchievementId'
      responses:
        '200':
          description: 成果详情
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AchievementDetail'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/catalog/{collection}:
    get:
      tags: [Catalog]
      summary: 分页查询作者、机构、载体或主题
      operationId: listCatalogEntities
      security: [{sessionCookie: []}]
      parameters:
        - name: collection
          in: path
          required: true
          schema: {type: string, enum: [authors, organizations, venues, topics]}
        - {name: name, in: query, schema: {type: string, maxLength: 200}}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 目录实体分页
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CatalogEntityPage'}
  /api/v1/catalog/{collection}/{entityId}/achievements:
    get:
      tags: [Catalog]
      summary: 分页查询目录实体关联成果
      operationId: listCatalogEntityAchievements
      security: [{sessionCookie: []}]
      parameters:
        - name: collection
          in: path
          required: true
          schema: {type: string, enum: [authors, organizations, venues, topics]}
        - name: entityId
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 关联成果分页
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AchievementPage'}
  /api/v1/duplicate-candidates:
    get:
      tags: [Governance]
      summary: 分页查询重复候选
      operationId: listDuplicateCandidates
      security: [{sessionCookie: []}]
      parameters:
        - {name: entityType, in: query, schema: {type: string, enum: [ACHIEVEMENT, AUTHOR, ORGANIZATION, VENUE]}}
        - {name: status, in: query, schema: {type: string, enum: [PENDING, ACCEPTED, REJECTED]}}
        - {name: sourceId, in: query, schema: {type: integer, format: int64, minimum: 1}}
        - {name: ruleVersion, in: query, schema: {type: integer, minimum: 1}}
        - {name: createdFrom, in: query, schema: {type: string, format: date-time}}
        - {name: createdTo, in: query, schema: {type: string, format: date-time}}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 仅含有限匹配证据的候选分页
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DuplicateCandidatePage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/duplicate-candidates/{candidateId}:
    get:
      tags: [Governance]
      summary: 查询重复候选详情
      operationId: getDuplicateCandidate
      security: [{sessionCookie: []}]
      parameters:
        - {name: candidateId, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        '200':
          description: 候选详情
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DuplicateCandidate'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/duplicate-candidates/{candidateId}/accept:
    post:
      tags: [Governance]
      summary: 接受候选并建立逻辑规范关联
      operationId: acceptDuplicateCandidate
      security: [{sessionCookie: []}]
      parameters:
        - {name: candidateId, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CandidateAcceptRequest'}
      responses:
        '200': {description: 接受决定, content: {application/json: {schema: {$ref: '#/components/schemas/MergeDecision'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/duplicate-candidates/{candidateId}/reject:
    post:
      tags: [Governance]
      summary: 拒绝候选并抑制同规则重复生成
      operationId: rejectDuplicateCandidate
      security: [{sessionCookie: []}]
      parameters:
        - {name: candidateId, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VersionReasonRequest'}
      responses:
        '200': {description: 拒绝决定, content: {application/json: {schema: {$ref: '#/components/schemas/MergeDecision'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/merge-decisions/{decisionId}/revert:
    post:
      tags: [Governance]
      summary: 撤销当前生效且无后续依赖的治理决定
      operationId: revertMergeDecision
      security: [{sessionCookie: []}]
      parameters:
        - {name: decisionId, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VersionReasonRequest'}
      responses:
        '200': {description: 撤销决定, content: {application/json: {schema: {$ref: '#/components/schemas/MergeDecision'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/catalog/achievements/{achievementId}/field-overrides:
    post:
      tags: [Governance]
      summary: 创建或更新成果人工字段修正
      operationId: overrideAchievementField
