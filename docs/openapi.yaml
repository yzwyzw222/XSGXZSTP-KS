        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
  parameters:
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    SourceId:
      name: sourceId
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    TaskId:
      name: taskId
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    RunId:
      name: runId
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    AchievementId:
      name: achievementId
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  requestBodies:
    VersionRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VersionRequest'
  responses:
    UserResponse:
      description: 更新后的用户
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/User'
    BadRequest:
      description: 请求校验失败
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: 未登录、凭据错误或会话失效
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 权限不足或 CSRF Token 无效
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 资源状态、并发限制、用户名或乐观锁版本冲突
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 请求的资源不存在
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Gone:
      description: 请求的导出文件已经过期
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    GraphUnavailable:
      description: Neo4j不可用或图投影正在重建
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    GraphQueryTimeout:
      description: Neo4j图查询超过服务端限定时间
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    RoleCode:
      type: string
      enum: [ADMIN, DATA_OPERATOR, RESEARCHER]
    Permission:
      type: string
      enum:
        - ACCOUNT_SELF_READ
        - USER_LIST
        - USER_CREATE
        - USER_ENABLE
        - USER_DISABLE
        - USER_PASSWORD_RESET
        - USER_ROLE_CHANGE
        - AUDIT_READ
        - SOURCE_READ
        - SOURCE_MANAGE
        - SOURCE_PROBE
        - CRAWL_TASK_READ
        - CRAWL_TASK_CREATE
        - CRAWL_TASK_UPDATE
        - CRAWL_TASK_CONTROL
        - CRAWL_SCHEDULE_MANAGE
        - CRAWL_RUN_READ
        - GOVERNANCE_READ
        - GOVERNANCE_MANAGE
        - CATALOG_READ
        - GRAPH_READ
        - GRAPH_SYNC_READ
        - GRAPH_SYNC_MANAGE
        - ANALYTICS_READ
        - EXPORT_CREATE
        - EXPORT_READ
        - OPERATIONS_READ
        - ALERT_MANAGE
    CsrfToken:
      type: object
      required: [headerName, parameterName, token]
      properties:
        headerName:
          type: string
        parameterName:
          type: string
        token:
          type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 64
        password:
          type: string
          format: password
          writeOnly: true
          maxLength: 128
    CurrentUser:
      type: object
      required: [id, username, roles, permissions]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        roles:
          type: array
          uniqueItems: true
          items:
