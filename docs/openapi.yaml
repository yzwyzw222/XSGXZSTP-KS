      operationId: acknowledgeAlertEvent
      x-required-permission: ALERT_MANAGE
      security: [{sessionCookie: []}]
      parameters:
        - {name: alertId, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
        - {$ref: '#/components/parameters/CsrfHeader'}
