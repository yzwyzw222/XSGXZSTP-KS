        requestedBy: {type: integer, format: int64, minimum: 1}
        requestedCount: {type: integer, format: int64, minimum: 0, maximum: 10000}
        exportedCount: {type: integer, format: int64, minimum: 0, maximum: 10000}
        downloadAvailable: {type: boolean}
        downloadToken: {type: [string, 'null'], minLength: 32, maxLength: 128, description: 仅成功且未过期的任务返回服务端生成的不可预测令牌}
        createdAt: {type: string, format: date-time}
        startedAt: {type: [string, 'null'], format: date-time}
        completedAt: {type: [string, 'null'], format: date-time}
        expiresAt: {type: [string, 'null'], format: date-time}
        errorCode: {type: [string, 'null']}
        errorMessage: {type: [string, 'null'], description: 有限安全摘要，不包含文件路径、SQL或敏感配置}
    HealthStatus:
      type: string
      enum: [UP, DOWN, DEGRADED, UNKNOWN]
    OperationsOverview:
      type: object
      required: [generatedAt, applicationStatus, mysqlStatus, neo4jStatus, activeCrawlRunCount, recentCrawlFailureCount, graphPendingCount, graphProcessingCount, graphDeadCount, openAlertCount]
      properties:
        generatedAt: {type: string, format: date-time}
        applicationStatus: {$ref: '#/components/schemas/HealthStatus'}
        mysqlStatus: {$ref: '#/components/schemas/HealthStatus'}
        neo4jStatus: {$ref: '#/components/schemas/HealthStatus'}
        activeCrawlRunCount: {type: integer, format: int64, minimum: 0}
        recentCrawlFailureCount: {type: integer, format: int64, minimum: 0, description: 最近24小时未解决失败数量}
        graphPendingCount: {type: integer, format: int64, minimum: 0}
        graphProcessingCount: {type: integer, format: int64, minimum: 0}
        graphDeadCount: {type: integer, format: int64, minimum: 0}
        openAlertCount: {type: integer, format: int64, minimum: 0}
    AlertType:
      type: string
      enum: [CRAWL_CONSECUTIVE_FAILURES, PARSE_SUCCESS_RATE_DROP, GRAPH_SYNC_BACKLOG]
    AlertSeverity:
      type: string
      enum: [WARNING, CRITICAL]
    AlertStatus:
      type: string
      enum: [OPEN, ACKNOWLEDGED]
    AlertEvent:
      type: object
      required: [id, type, severity, status, subjectType, subjectId, summary, evidence, firstDetectedAt, lastDetectedAt, occurrenceCount, acknowledgedBy, acknowledgedAt, acknowledgementReason, version]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        type: {$ref: '#/components/schemas/AlertType'}
        severity: {$ref: '#/components/schemas/AlertSeverity'}
        status: {$ref: '#/components/schemas/AlertStatus'}
        subjectType: {type: string, enum: [SOURCE, CRAWL_TASK, GRAPH_SYNC]}
        subjectId: {type: [string, 'null']}
        summary: {type: string, maxLength: 500, description: 有限安全摘要}
        evidence: {type: object, additionalProperties: true, description: 仅含计数、比例和时间等安全字段}
        firstDetectedAt: {type: string, format: date-time}
        lastDetectedAt: {type: string, format: date-time}
        occurrenceCount: {type: integer, format: int64, minimum: 1}
        acknowledgedBy: {type: [integer, 'null'], format: int64}
        acknowledgedAt: {type: [string, 'null'], format: date-time}
        acknowledgementReason: {type: [string, 'null'], maxLength: 1000}
        version: {type: integer, format: int64, minimum: 0}
    AlertEventPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/AlertEvent'}}
    AlertAcknowledgeRequest:
      type: object
      additionalProperties: false
      required: [reason, version]
      properties:
        reason: {type: string, minLength: 1, maxLength: 1000}
        version: {type: integer, format: int64, minimum: 0}
    Problem:
      type: object
      required: [type, title, status, detail, instance, errorCode, traceId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        errorCode:
          type: string
        traceId:
          type: string
        fieldErrors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
    DuplicateCandidate:
      type: object
      required: [id, entityType, leftEntityId, rightEntityId, matchBasis, evidence, status, ruleVersion, version, createdAt]
      properties:
        id: {type: integer, format: int64}
        entityType: {type: string, enum: [ACHIEVEMENT, AUTHOR, ORGANIZATION, VENUE]}
        leftEntityId: {type: integer, format: int64}
        rightEntityId: {type: integer, format: int64}
        matchBasis: {type: string, enum: [FINGERPRINT, TEXT_NAME, SOURCE_POSITION]}
        evidence: {type: object, additionalProperties: true, description: 有限匹配证据，不含原始Payload}
        status: {type: string, enum: [PENDING, ACCEPTED, REJECTED]}
        sourceId: {type: [integer, 'null'], format: int64}
        ruleVersion: {type: integer, minimum: 1}
        version: {type: integer, format: int64, minimum: 0}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    DuplicateCandidatePage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/DuplicateCandidate'}}
    CandidateAcceptRequest:
      type: object
      required: [canonicalEntityId, reason, version]
      properties:
        canonicalEntityId: {type: integer, format: int64, minimum: 1}
        reason: {type: string, minLength: 1, maxLength: 1000}
        version: {type: integer, format: int64, minimum: 0}
    VersionReasonRequest:
      type: object
      required: [reason, version]
      properties:
        reason: {type: string, minLength: 1, maxLength: 1000}
        version: {type: integer, format: int64, minimum: 0}
    MergeDecision:
      type: object
      required: [id, candidateId, decision, revisionId, actorUserId, reason, version, decidedAt]
      properties:
        id: {type: integer, format: int64}
        candidateId: {type: integer, format: int64}
        decision: {type: string, enum: [ACCEPT, REJECT, REVERT]}
        canonicalEntityId: {type: [integer, 'null'], format: int64}
        revisionId: {type: integer, format: int64}
        actorUserId: {type: integer, format: int64}
        reason: {type: string}
        version: {type: integer, format: int64}
        decidedAt: {type: string, format: date-time}
    FieldOverrideRequest:
      type: object
      required: [fieldName, value, reason, version]
      properties:
        fieldName: {type: string, enum: [title, type, language, publicationDate, venueId]}
        value: {}
        reason: {type: string, minLength: 1, maxLength: 1000}
        version: {type: integer, format: int64, minimum: 0}
    FieldOverride:
      type: object
      required: [achievementId, fieldName, value, revisionId, active, version, reason, updatedAt]
      properties:
        achievementId: {type: integer, format: int64}
        fieldName: {type: string, enum: [title, type, language, publicationDate, venueId]}
        value: {}
        revisionId: {type: integer, format: int64}
        active: {type: boolean}
        version: {type: integer, format: int64}
        reason: {type: string}
        updatedAt: {type: string, format: date-time}
    QualityMetricCode:
      type: string
      enum: [TOTAL_RECORDS, VALID_RECORDS, MISSING_OR_INVALID_DOI, MISSING_TITLE, MISSING_DATE, MISSING_AUTHORS, AUTHORS_WITHOUT_STABLE_ID, ORGANIZATIONS_WITHOUT_ROR, FIELD_CONFLICTS, AUTO_MATCHES, NEW_CANDIDATES]
    QualityMetric:
      type: object
      required: [id, sourceId, taskId, runId, metricCode, numerator, denominator, measuredAt, version]
      properties:
        id: {type: integer, format: int64}
        sourceId: {type: integer, format: int64}
        taskId: {type: integer, format: int64}
        runId: {type: integer, format: int64}
        metricCode: {$ref: '#/components/schemas/QualityMetricCode'}
        numerator: {type: integer, format: int64, minimum: 0}
        denominator: {type: integer, format: int64, minimum: 0}
        metricValue: {type: [number, 'null']}
        measuredAt: {type: string, format: date-time}
        version: {type: integer, format: int64, minimum: 0}
    QualityMetricPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/QualityMetric'}}
    QualityIssueSample:
      type: object
      required: [id, rawRecordId, externalRecordId, evidence, createdAt]
      properties:
        id: {type: integer, format: int64}
        rawRecordId: {type: integer, format: int64}
        externalRecordId: {type: string}
        evidence: {type: object, additionalProperties: true, description: 有限质量证据，不含原始Payload}
        createdAt: {type: string, format: date-time}
    QualityMetricDetail:
      type: object
      required: [metric, samples]
      properties:
        metric: {$ref: '#/components/schemas/QualityMetric'}
        samples: {type: array, items: {$ref: '#/components/schemas/QualityIssueSample'}}
